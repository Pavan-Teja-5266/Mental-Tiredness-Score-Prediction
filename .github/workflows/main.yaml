name: Mental Tiredness MLOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: mental-tiredness-streamlit-app
  MAX_TEST_RMSE: "6.5"     # maximum allowed champion TEST RMSE
  MIN_TEST_R2: "0.70"      # minimum required champion TEST R2

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install training dependencies
        run: pip install -r requirements.txt

      - name: Run DVC pipeline (train, compare, select champion, evaluate)
        run: dvc repro

      - name: Show metrics
        run: dvc metrics show

      - name: Publish model comparison to job summary
        if: always()
        run: |
          if [ -f reports/model_comparison.md ]; then
            cat reports/model_comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Quality gate (RMSE, R2, overfitting gap, selection sanity)
        run: |
          python - <<'PY'
          import json, os, sys
          import yaml

          metrics = json.load(open("reports/metrics.json"))
          selection = json.load(open("reports/model_selection.json"))
          params = yaml.safe_load(open("params.yaml"))

          max_rmse = float(os.environ["MAX_TEST_RMSE"])
          min_r2 = float(os.environ["MIN_TEST_R2"])
          max_gap = float(params["selection"]["max_rmse_gap"])

          test_rmse = metrics["test_rmse"]
          test_r2 = metrics["test_r2"]
          gap = metrics["rmse_gap"]
          champion = selection["champion"]["model_name"]
          fallback = selection["selection_policy"]["fallback_used"]

          print(f"Champion : {champion}")
          print(f"Test RMSE: {test_rmse:.4f} (max {max_rmse})")
          print(f"Test R2  : {test_r2:.4f} (min {min_r2})")
          print(f"RMSE gap : {gap:+.4f} (must be < {max_gap})")
          print(f"Fallback : {fallback}")

          failures = []
          if test_rmse > max_rmse:
              failures.append("test RMSE above maximum threshold")
          if test_r2 < min_r2:
              failures.append("test R2 below minimum threshold")
          if gap >= max_gap:
              failures.append("champion RMSE gap not strictly below threshold")
          if fallback:
              failures.append("no model met the RMSE-gap rule (fallback was used)")

          if failures:
              print("QUALITY GATE FAILED: " + "; ".join(failures))
              sys.exit(1)
          print("Quality gate passed")
          PY

      - name: Upload champion model and reports
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.pkl
            reports/metrics.json
            reports/evaluation_details.json
            reports/model_selection.json
            reports/model_comparison.csv
            reports/model_comparison.md
          if-no-files-found: error

  docker:
    needs: train
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download champion model
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts

      - name: Place model where the Dockerfile expects it
        run: |
          mkdir -p models
          cp artifacts/models/model.pkl models/model.pkl

      - name: Build image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Smoke test the container
        run: |
          docker run -d --name tiredness-app -p 8501:8501 $IMAGE_NAME:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo; echo "App is healthy"; exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy"; docker logs tiredness-app; exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && env.HAS_DOCKERHUB == 'true'
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/$IMAGE_NAME
          docker tag $IMAGE_NAME:latest $IMAGE:latest
          docker tag $IMAGE_NAME:latest $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
